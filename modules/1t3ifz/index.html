<style>
  /* sss-kart-deste — sss-ray yatay kayan kart şeridi (hepsi yan yana), sss-cevir-kart her kartı yerinde çevirir; bu modülde aynı anda tek soru okunur — kartlar aynı ızgara hücresinde üst üste, sıra değişince alttaki kart öne gelir (deste/yığın iskeleti, inert alt kartlar, sayaç + nokta göstergesi). */
  .modulex-sss-kart-deste { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sss-kart-deste *, .modulex-sss-kart-deste *::before, .modulex-sss-kart-deste *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sss-kart-deste :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sss-kart-deste :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sss-kart-deste :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sss-kart-deste :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sss-kart-deste img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sss-kart-deste) img { height: auto; }
  .modulex-sss-kart-deste [hidden] { display: none !important; }
  .modulex-sss-kart-deste :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sss-kart-deste :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sss-kart-deste-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sss-kart-deste-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sss-kart-deste--bassiz .modulex-sss-kart-deste-bas { display: none; }
  .modulex-sss-kart-deste-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sss-kart-deste-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sss-kart-deste-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sss-kart-deste-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-sss-kart-deste-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sss-kart-deste-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sss-kart-deste-dugme:hover { transform: translateY(-2px); }
  .modulex-sss-kart-deste-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sss-kart-deste-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sss-kart-deste-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sss-kart-deste { --yon: 1; }
  :is([dir="rtl"]) .modulex-sss-kart-deste { --yon: -1; }
  .modulex-sss-kart-deste-deste { max-width: 760px; margin-inline: auto; overflow-x: clip; }
  .modulex-sss-kart-deste-yigin { display: grid; gap: 16px; }
  .modulex-sss-kart-deste-kart { display: grid; align-content: start; gap: 16px; min-height: 300px; padding: clamp(26px, 4vw, 44px); border: 1px solid --cizgi--; border-radius: --yuvarlak--; background-color: color-mix(in srgb, --text-- 9%, --bg--); box-shadow: 0 20px 40px -26px rgba(0, 0, 0, 0.6); }
  .modulex-sss-kart-deste-kust { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .modulex-sss-kart-deste-ksira { padding: 4px 12px; border-radius: 999px; background-color: --vurguBg--; color: --vurguText--; font-size: 0.85rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .modulex-sss-kart-deste-kikon { color: --accentInk--; font-size: 38px; }
  .modulex-sss-kart-deste-ksoru { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.4rem, 2.8vw, 2.1rem); font-weight: 800; letter-spacing: -0.015em; line-height: 1.2; }
  .modulex-sss-kart-deste-cevap { color: --muted--; font-size: 1.06rem; line-height: 1.75; }
  .modulex-sss-kart-deste--djs .modulex-sss-kart-deste-deste { padding-block-end: 26px; padding-inline-end: 26px; }
  .modulex-sss-kart-deste--djs .modulex-sss-kart-deste-kart { grid-area: 1 / 1; transform-origin: 50% 100%; transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0.45s ease, background-color 0.3s ease; }
  .modulex-sss-kart-deste--djs .modulex-sss-kart-deste-kart[data-konum="0"] { z-index: 3; }
  .modulex-sss-kart-deste--djs .modulex-sss-kart-deste-kart[data-konum="1"] { z-index: 2; transform: translate(calc(var(--yon) * 12px), 12px) rotate(calc(var(--yon) * 2deg)); background-color: color-mix(in srgb, --text-- 6%, --bg--); }
  .modulex-sss-kart-deste--djs .modulex-sss-kart-deste-kart[data-konum="2"] { z-index: 1; transform: translate(calc(var(--yon) * 24px), 24px) rotate(calc(var(--yon) * 4deg)); background-color: color-mix(in srgb, --text-- 4%, --bg--); }
  .modulex-sss-kart-deste--djs .modulex-sss-kart-deste-kart[data-konum="x"] { visibility: hidden; }
  .modulex-sss-kart-deste--djs .modulex-sss-kart-deste-kart:not([data-konum="0"]) > * { visibility: hidden; }
  .modulex-sss-kart-deste--djs .modulex-sss-kart-deste-deste { touch-action: pan-y; }
  .modulex-sss-kart-deste-kumanda { display: flex; align-items: center; justify-content: center; gap: 14px; margin-block-start: 24px; }
  .modulex-sss-kart-deste-yon { display: inline-grid; place-items: center; width: 48px; height: 48px; border: 1px solid --cizgi--; border-radius: 14px; background-color: transparent; color: --text--; transition: background-color 0.25s ease, color 0.25s ease, transform 0.25s ease; }
  .modulex-sss-kart-deste-yon:hover { background-color: --accent--; color: --accentText--; transform: translateY(-2px); }
  .modulex-sss-kart-deste-noktalar { display: flex; flex-wrap: wrap; justify-content: center; }
  .modulex-sss-kart-deste-nokta { display: grid; place-items: center; width: 28px; height: 32px; padding: 0; border: 0; background-color: transparent; }
  .modulex-sss-kart-deste-nokta::before { content: ""; width: 8px; height: 8px; border-radius: 999px; background-color: --muted--; transition: width 0.3s ease, background-color 0.3s ease; }
  .modulex-sss-kart-deste-nokta[aria-current="true"]::before { width: 22px; background-color: --accent--; }
  .modulex-sss-kart-deste-sayac { min-width: 4.5em; color: --muted--; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
  .modulex-sss-kart-deste-sayac output { color: --text--; font-size: 1.2rem; font-weight: 900; }
  @media (max-width: 768px) {
    .modulex-sss-kart-deste-kart { min-height: 260px; }
    .modulex-sss-kart-deste--djs .modulex-sss-kart-deste-deste { padding-block-end: 20px; padding-inline-end: 18px; }
    .modulex-sss-kart-deste-kumanda { gap: 6px; }
    .modulex-sss-kart-deste-sayac { display: none; }
    .modulex-sss-kart-deste-yon { width: 44px; height: 44px; }
  }
  .modulex-sss-kart-deste-bag { display: inline-flex; align-items: center; gap: 6px; margin-block-start: 10px; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.25s ease; }
  .modulex-sss-kart-deste-bag:hover { gap: 10px; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-sss-kart-deste-bag .material-symbols-outlined { font-size: 18px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sss-kart-deste :is(.modulex-sss-kart-deste-baslik, .modulex-sss-kart-deste-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sss-kart-deste-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-sss-kart-deste { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sss-kart-deste *, .modulex-sss-kart-deste *::before, .modulex-sss-kart-deste *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sss-kart-deste";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const desteGez = (s, P) => {
        const d = s.querySelector("[data-deste]");
        const k = d ? [...d.querySelectorAll("[data-deste-kart]")] : [];
        if (k.length < 2) return;
        s.classList.add(P + "--djs");
        const kum = s.querySelector("[data-deste-kumanda]");
        if (kum) kum.hidden = false;
        const sira = s.querySelector("[data-deste-sira]");
        const nok = [...s.querySelectorAll("[data-deste-nokta]")];
        let nf = null;
        try { nf = new Intl.NumberFormat(document.documentElement.lang || undefined); } catch (e) { nf = null; }
        let i = 0;
        const git = (n) => {
          i = (n + k.length) % k.length;
          k.forEach((x, j) => {
            const f = (j - i + k.length) % k.length;
            x.dataset.konum = f < 3 ? String(f) : "x";
            x.inert = f !== 0;
            if (f) x.setAttribute("aria-hidden", "true"); else x.removeAttribute("aria-hidden");
          });
          nok.forEach((b, j) => b.setAttribute("aria-current", String(j === i)));
          if (sira) sira.textContent = nf ? nf.format(i + 1) : String(i + 1);
        };
        d.tabIndex = 0;
        s.querySelectorAll("[data-deste-git]").forEach((b) => b.addEventListener("click", () => git(i + (b.dataset.desteGit === "ileri" ? 1 : -1))));
        nok.forEach((b, j) => b.addEventListener("click", () => git(j)));
        d.addEventListener("keydown", (e) => {
          const rtl = getComputedStyle(s).direction === "rtl";
          let n = null;
          if (e.key === (rtl ? "ArrowLeft" : "ArrowRight")) n = i + 1;
          else if (e.key === (rtl ? "ArrowRight" : "ArrowLeft")) n = i - 1;
          else if (e.key === "Home") n = 0;
          else if (e.key === "End") n = k.length - 1;
          if (n !== null) { e.preventDefault(); git(n); }
        });
        let x0 = null;
        d.addEventListener("pointerdown", (e) => { x0 = e.clientX; });
        d.addEventListener("pointerup", (e) => {
          if (x0 === null) return;
          const dx = e.clientX - x0;
          x0 = null;
          if (Math.abs(dx) < 40) return;
          const rtl = getComputedStyle(s).direction === "rtl";
          git(i + ((dx < 0) !== rtl ? 1 : -1));
        });
        git(0);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      desteGez(s, P, az);
    });
  })();
</script>
