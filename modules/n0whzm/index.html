<header class="modulex-ust-spot-isik{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-ust-spot-isik-ic">
    {{fbbas}}
    {{fbgovde}}

<style>
  /* ust-spot-isik — İmleç konumuna tepki veren ışık (yalnız öğe değil sahnenin tamamı): gece/sahne dili — kayan çizgi göstergesinden farkı serbest dolaşan, yumuşak radyal ışık. */
  .modulex-ust-spot-isik { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-ust-spot-isik *, .modulex-ust-spot-isik *::before, .modulex-ust-spot-isik *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-ust-spot-isik :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-ust-spot-isik :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-ust-spot-isik :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-ust-spot-isik :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-ust-spot-isik img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-ust-spot-isik) img { height: auto; }
  .modulex-ust-spot-isik [hidden] { display: none !important; }
  .modulex-ust-spot-isik :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-ust-spot-isik :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-ust-spot-isik-ic { max-width: --max--; margin-inline: auto; }
  .modulex-ust-spot-isik-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-ust-spot-isik--bassiz .modulex-ust-spot-isik-bas { display: none; }
  .modulex-ust-spot-isik-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-ust-spot-isik-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-ust-spot-isik-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-ust-spot-isik-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ust-spot-isik-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-ust-spot-isik-dugme:hover { transform: translateY(-2px); }
  .modulex-ust-spot-isik-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-ust-spot-isik-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-ust-spot-isik-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-ust-spot-isik { position: relative; z-index: 900; }
  .modulex-ust-spot-isik-logo { display: inline-flex; flex: 0 1 auto; min-width: 0; align-items: center; color: inherit; text-decoration: none; }
  /* dar ekranda geniş logo/uzun ad çubuğu taşırmasın: logo daralır (img max-width 100%), ad sarar */
  .modulex-ust-spot-isik-logo img { width: auto; max-height: --logoH--; }
  .modulex-ust-spot-isik-ad { font-family: var(--mx-font-heading, inherit); font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .modulex-ust-spot-isik-oge { position: relative; display: inline-flex; align-items: center; min-height: 44px; color: inherit; font-weight: 600; text-decoration: none; transition: color 0.2s ease, background 0.2s ease; }
  .modulex-ust-spot-isik-oge:hover, .modulex-ust-spot-isik-oge[aria-current="page"] { color: --accentInk--; }
  .modulex-ust-spot-isik-cta { display: inline-flex; flex: none; align-items: center; gap: 6px; min-height: 44px; padding: 8px 18px; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; white-space: nowrap; transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .modulex-ust-spot-isik-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -12px --accent--; }
  .modulex-ust-spot-isik-cta .material-symbols-outlined, .modulex-ust-spot-isik-tel .material-symbols-outlined, .modulex-ust-spot-isik-posta .material-symbols-outlined { font-size: 18px; }
  .modulex-ust-spot-isik-tel, .modulex-ust-spot-isik-posta { display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; white-space: nowrap; }
  .modulex-ust-spot-isik-tel:hover, .modulex-ust-spot-isik-posta:hover { color: --accentInk--; }
  .modulex-ust-spot-isik-dil:empty { display: none; }
  .modulex-ust-spot-isik-ac { display: none; align-items: center; gap: 10px; min-width: 46px; min-height: 46px; padding: 0 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: inherit; font: inherit; font-weight: 700; }
  .modulex-ust-spot-isik-ac-ikon { display: grid; gap: 4px; width: 20px; }
  .modulex-ust-spot-isik-ac-ikon span { display: block; height: 2px; border-radius: 2px; background: currentColor; transition: transform 0.3s ease, opacity 0.3s ease; }
  .modulex-ust-spot-isik--acik .modulex-ust-spot-isik-ac-ikon span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .modulex-ust-spot-isik--acik .modulex-ust-spot-isik-ac-ikon span:nth-child(2) { opacity: 0; }
  .modulex-ust-spot-isik--acik .modulex-ust-spot-isik-ac-ikon span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  .modulex-ust-spot-isik-kapat { display: inline-grid; place-items: center; width: 46px; height: 46px; border: 1px solid --cizgi--; border-radius: 50%; background: transparent; color: inherit; }
  .modulex-ust-spot-isik-perde { position: fixed; inset: 0; z-index: 1; background: color-mix(in srgb, --text-- 45%, transparent); animation: modulex-ust-spot-isik-sol 0.3s ease both; }
  @keyframes modulex-ust-spot-isik-sol { from { opacity: 0; } to { opacity: 1; } }

  .modulex-ust-spot-isik-panel { display: grid; gap: 14px; }
  @media (max-width: 1024px) {
    .modulex-ust-spot-isik--js .modulex-ust-spot-isik-nav, .modulex-ust-spot-isik--js .modulex-ust-spot-isik-genis { display: none; }
    .modulex-ust-spot-isik--js .modulex-ust-spot-isik-ac { display: inline-flex; }
    .modulex-ust-spot-isik-panel { position: absolute; inset-inline: 0; inset-block-start: 100%; padding: 16px 20px 24px; border-block-end: 1px solid --cizgi--; background: --bg--; box-shadow: 0 24px 40px -28px color-mix(in srgb, --text-- 55%, transparent); animation: modulex-ust-spot-isik-in 0.3s ease both; }
    .modulex-ust-spot-isik-pliste { display: grid; }
    .modulex-ust-spot-isik-pliste .modulex-ust-spot-isik-oge { width: 100%; min-height: 50px; border-block-end: 1px solid --cizgi--; font-size: 1.05rem; }
    .modulex-ust-spot-isik-palt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  }
  @media (min-width: 1025px) {
    .modulex-ust-spot-isik-panel { display: none !important; }
  }
  @keyframes modulex-ust-spot-isik-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  .modulex-ust-spot-isik-tavan { display: flex; align-items: center; justify-content: space-between; gap: 14px 26px; padding-block: 14px; }
  .modulex-ust-spot-isik-sahne { position: relative; overflow: hidden; padding: 4px; border-radius: 16px; box-shadow: inset 0 0 0 1px --cizgi--; }
  .modulex-ust-spot-isik-isik { position: absolute; inset: 0; z-index: 0; background-image: radial-gradient(circle 110px at var(--sx, 50%) var(--sy, 50%), color-mix(in srgb, --accent-- 42%, transparent), transparent 75%); opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
  .modulex-ust-spot-isik:not(.modulex-ust-spot-isik--sp) .modulex-ust-spot-isik-isik { display: none; }
  .modulex-ust-spot-isik-sliste { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 2px; }
  .modulex-ust-spot-isik-soge { position: relative; display: inline-flex; align-items: center; min-height: 44px; padding-inline: 16px; border-radius: 12px; color: inherit; font-weight: 600; letter-spacing: 0.01em; text-decoration: none; transition: color 0.25s ease, text-shadow 0.25s ease; }
  .modulex-ust-spot-isik-soge:hover, .modulex-ust-spot-isik-soge:focus-visible { color: --accentInk--; text-shadow: 0 0 18px color-mix(in srgb, --accent-- 70%, transparent); }
  .modulex-ust-spot-isik-soge[aria-current="page"]::after { content: ""; position: absolute; inset-inline: 16px; inset-block-end: 6px; height: 2px; border-radius: 2px; background-color: --accent--; box-shadow: 0 0 12px --accent--; animation: modulex-ust-spot-isik-yan 2.4s ease-in-out infinite alternate; }
  @keyframes modulex-ust-spot-isik-yan { from { opacity: 0.6; } to { opacity: 1; } }
  .modulex-ust-spot-isik-genis { display: flex; align-items: center; gap: 12px; }
  @media (max-width: 1024px) {
    .modulex-ust-spot-isik:not(.modulex-ust-spot-isik--js) .modulex-ust-spot-isik-tavan { flex-wrap: wrap; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-spot-isik :is(.modulex-ust-spot-isik-baslik, .modulex-ust-spot-isik-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-spot-isik-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ust-spot-isik { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ust-spot-isik *, .modulex-ust-spot-isik *::before, .modulex-ust-spot-isik *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ust-spot-isik";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const cekmece = (s, P) => {
          const ac = s.querySelector("." + P + "-ac");
          const panel = ac ? document.getElementById(ac.getAttribute("aria-controls")) : null;
          if (!ac || !panel) return;
          s.classList.add(P + "--js");
          const perde = s.querySelector("." + P + "-perde");
          const modal = panel.getAttribute("aria-modal") === "true";
          const kok = document.documentElement;
          const kapa = (odak) => {
            if (panel.hidden) return;
            panel.hidden = true;
            if (perde) perde.hidden = true;
            ac.setAttribute("aria-expanded", "false");
            s.classList.remove(P + "--acik");
            if (modal) kok.style.overflow = "";
            if (odak) ac.focus();
          };
          const aci = () => {
            panel.hidden = false;
            if (perde) perde.hidden = false;
            ac.setAttribute("aria-expanded", "true");
            s.classList.add(P + "--acik");
            if (modal) kok.style.overflow = "hidden";
            const ilk = panel.querySelector("a[href], button");
            if (ilk) ilk.focus();
          };
          ac.addEventListener("click", () => (panel.hidden ? aci() : kapa(true)));
          panel.addEventListener("click", (e) => {
            if (e.target.closest("." + P + "-kapat")) kapa(true);
            else if (e.target.closest("a[href]")) kapa(false);
          });
          if (perde) perde.addEventListener("click", () => kapa(true));
          document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden) kapa(true); });
          if (modal) {
            panel.addEventListener("keydown", (e) => {
              if (e.key !== "Tab") return;
              const o = [...panel.querySelectorAll("a[href], button:not([disabled])")].filter((x) => x.offsetParent !== null);
              if (!o.length) return;
              if (e.shiftKey && document.activeElement === o[0]) { e.preventDefault(); o[o.length - 1].focus(); }
              else if (!e.shiftKey && document.activeElement === o[o.length - 1]) { e.preventDefault(); o[0].focus(); }
            });
          }
          const g = Number(ac.dataset.genis);
          if (g && window.matchMedia) window.matchMedia(`(min-width: ${g}px)`).addEventListener("change", (m) => { if (m.matches) kapa(false); });
        };
    const spot = (s, P) => {
        const sahne = s.querySelector("." + P + "-sahne");
        const isik = s.querySelector("." + P + "-isik");
        if (!sahne || !isik) return;
        s.classList.add(P + "--sp");
        const koy = (x, y, gor) => {
          isik.style.setProperty("--sx", Math.round(x) + "px");
          isik.style.setProperty("--sy", Math.round(y) + "px");
          isik.style.opacity = gor ? "1" : "0";
        };
        const merkez = (el) => {
          const n = sahne.getBoundingClientRect();
          const r = el.getBoundingClientRect();
          koy(r.left - n.left + r.width / 2, r.top - n.top + r.height / 2, true);
        };
        const dinlen = () => {
          const a = sahne.querySelector('[aria-current="page"]');
          if (a && a.offsetWidth) merkez(a);
          else koy(0, 0, false);
        };
        sahne.addEventListener("pointermove", (e) => { const n = sahne.getBoundingClientRect(); koy(e.clientX - n.left, e.clientY - n.top, true); });
        sahne.addEventListener("pointerleave", dinlen);
        sahne.addEventListener("focusin", (e) => { const a = e.target.closest("a"); if (a) merkez(a); });
        sahne.addEventListener("focusout", (e) => { if (!sahne.contains(e.relatedTarget)) dinlen(); });
        window.addEventListener("resize", dinlen);
        dinlen();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      cekmece(s, P, az);
      spot(s, P, az);
    });
  })();
</script>
